function bank(){return config.mode==='bible'?BIBLE:GENERAL}
function filtered(){return bank().filter(q=>config.topic==='Todos'||q.topic===config.topic)}
function home(){pause();let resume=session&&!session.done?`<div class="resume"><span><b>Tu partida te espera.</b><br>${esc(session.players.map(p=>p.name).join(' · '))} · ${session.log.length} respuestas guardadas</span><button class="btn small" onclick="resumeGame()">Continuar partida ↗</button></div>`:session?.done?`<div class="resume"><span><b>La última noche quedó guardada.</b><br>Podés volver a ver el resultado y repasar las respuestas.</span><button class="btn small" onclick="renderResult()">Ver última partida ↗</button></div>`:'';
mount(`${resume}<section class="hero"><div><div class="eyebrow">UNA MESA · BUENAS PREGUNTAS · GRAN COMPAÑÍA</div><h1>La próxima<br>buena <em>pregunta.</em></h1><p>Una noche para poner a prueba lo que sabés.<br>Y llevarte algo nuevo, gane quien gane.</p></div><div class="hero-art" aria-hidden="true"><div class="orbit"></div><span class="art-star">✳</span><div class="art-book"><span>EDICIÓN PARA COMPARTIR</span><b>?</b><span>NOCHE DE TRIVIA / VOL. 02</span></div><span class="art-pill">Una más y seguimos ↗</span></div></section>
<div class="homegrid"><section class="panel"><div class="panel-title"><h2>Armemos la partida.</h2><span class="eyebrow">01 — 03</span></div><div class="step-label"><span>1</span>¿Qué tenemos ganas de jugar?</div><div class="segmented"><button class="modepick ${config.mode==='bible'?'active':''}" onclick="setConfig('mode','bible')" aria-pressed="${config.mode==='bible'}"><span class="mode-icon">▤</span><strong>Desafío bíblico</strong><small>Relatos, personas y enseñanzas.<br>Con referencias para aprender.</small></button><button class="modepick ${config.mode==='general'?'active':''}" onclick="setConfig('mode','general')" aria-pressed="${config.mode==='general'}"><span class="mode-icon">◎</span><strong>Cultura general</strong><small>Arte, música, ciencia y series.<br>Un poco de todo, para todos.</small></button></div>
<div class="step"><div class="step-label"><span>2</span>Elegí tu forma de jugar</div><div class="fields"><label class="field">Modalidad<select onchange="setConfig('play',this.value)"><option value="party" ${config.play==='party'?'selected':''}>Concurso · 1 a 4 personas</option><option value="study" ${config.play==='study'?'selected':''}>Práctica · sin cronómetro</option></select></label><label class="field">Tema<select onchange="setConfig('topic',this.value)"><option>Todos</option>${(config.mode==='bible'?topics():[]).map(t=>`<option ${config.topic===t?'selected':''}>${t}</option>`).join('')}</select></label><label class="field">Preguntas por persona<select onchange="setConfig('count',Number(this.value))">${[5,10].map(n=>`<option ${config.count===n?'selected':''} value="${n}">${n} preguntas</option>`).join('')}</select></label><label class="field">Tiempo por pregunta<select onchange="setConfig('time',Number(this.value))" ${config.play==='study'?'disabled':''}>${[15,30,45,60].map(n=>`<option ${config.time===n?'selected':''} value="${n}">${n} segundos</option>`).join('')}</select></label></div></div>
<div class="step"><div class="step-label"><span>3</span>¿Quiénes se suman?</div>${config.play==='party'?`<label class="field" style="margin-bottom:15px">Cantidad de personas<select onchange="setConfig('n',Number(this.value))">${[1,2,3,4].map(n=>`<option value="${n}" ${config.n===n?'selected':''}>${n} ${n===1?'persona':'personas'}</option>`).join('')}</select></label>`:''}<div class="players">${Array.from({length:config.play==='study'?1:config.n},(_,i)=>`<label class="playerfield"><span class="avatar">${i+1}</span><input aria-label="Nombre de la persona ${i+1}" maxlength="28" placeholder="${config.play==='study'?'Tu nombre':'Persona '+(i+1)}" value="${esc(config.names[i])}" oninput="config.names[${i}]=this.value"></label>`).join('')}</div></div><button class="btn full start" onclick="requestStart()">${config.play==='study'?'Empezar a practicar':'Todo listo. ¡A jugar!'} <span>↗</span></button><p class="fine">${filtered().length} preguntas disponibles para esta selección. Sin repeticiones en la partida. ${!storageOK?'El navegador no permite guardar el progreso.':''}</p><div id="configError" class="error" role="status"></div></section>
<aside><div class="aside-note"><div class="eyebrow">EL GUSTO ESTÁ EN APRENDER</div><h2>La respuesta<br>también cuenta.</h2><p>En el desafío bíblico, cada respuesta viene con una explicación y un enlace al pasaje. Revisá el contexto, no solo la letra correcta.</p><div class="stats"><div><b>${BIBLE.length}</b><small>Preguntas bíblicas</small></div><div><b>1–4</b><small>Personas por partida</small></div></div></div><button class="aside-link" onclick="showRules()">Cómo se juega <span>↗</span></button><button class="aside-link" onclick="showLibrary()">Explorar preguntas y referencias <span>↗</span></button><p class="fine">Referencias bíblicas: Traducción del Nuevo Mundo, edición de estudio. Proyecto independiente, sin afiliación oficial. El juego funciona sin conexión; los enlaces requieren internet.</p></aside></div>`)}
function setConfig(k,v){config[k]=v;if(k==='mode')config.topic='Todos';home()}
function showRules(){modal('Todos en la misma página.',`<ol class="rules"><li>Se alterna una pregunta por persona en cada ronda. Cada acierto suma <b>10 puntos</b>.</li><li>El presentador inicia el reloj. Antes de iniciarlo, las respuestas están bloqueadas. En práctica no hay límite de tiempo.</li><li>Cada persona puede usar una vez el <b>50/50</b>, la <b>consulta al público</b> y <b>15 segundos extra</b>. La consulta se carga con votos reales en este dispositivo.</li><li>El resultado y la referencia aparecen después de responder. No se repiten preguntas durante una partida.</li><li>Si hay empate, se juega una pregunta extra por persona empatada, sin comodines. Se repite mientras queden preguntas suficientes; si se agotan, se comparte el primer puesto.</li><li>Salir, cambiar de pestaña o recargar pausa el reloj. La partida se guarda en este navegador, si permite almacenamiento local.</li></ol><button class="btn full" onclick="closeModal()">Entendido</button>`)}
function requestStart(){let n=config.play==='study'?1:config.n,available=filtered().length;if(available<n*config.count){$('configError').textContent=`Este tema tiene ${available} preguntas. Elegí menos personas, 5 preguntas o el tema “Todos”.`;return}if(session&&!session.done){modal('¿Empezar otra partida?','<p>La partida guardada será reemplazada.</p><div class="row"><button class="btn secondary" onclick="closeModal()">Conservar partida</button><button class="btn" onclick="startGame()">Empezar otra</button></div>')}else startGame()}
function startGame(){closeModal();pause();let n=config.play==='study'?1:config.n,names=config.names.slice(0,n).map((s,i)=>s.trim()||'Persona '+(i+1));if(new Set(names.map(s=>s.toLocaleLowerCase())).size!==n){notify('Usá un nombre diferente para cada persona.');return}let schedule=[];for(let round=0;round<config.count;round++)for(let i=0;i<n;i++)schedule.push(i);session={version:2,mode:config.mode,study:config.play==='study',base:config.time,count:config.count,players:names.map(name=>({name,score:0,jokers:{}})),schedule,pos:0,deck:shuffle(filtered()).map(q=>({...q,o:[...q.o]})),cursor:0,current:null,log:[],done:false,tie:false,round:0};nextCard()}
function getPlayer(){return session.players[session.schedule[session.pos]]}
function nextCard(){session.pendingTie=false;if(session.cursor>=session.deck.length)return finish();let raw=session.deck[session.cursor++],order=shuffle([0,1,2,3]);session.current={...raw,o:order.map(i=>raw.o[i]),c:order.indexOf(raw.c)};session.answer=null;session.remaining=session.study?null:session.tie?15:session.base;session.started=session.study;session.running=false;session.eliminated=[];session.votes=null;save();renderGame()}
function scoreMarkup(){return session.players.map((p,i)=>`<div class="score ${i===session.schedule[session.pos]?'active':''}"><span>${esc(p.name)}</span><b>${p.score} <small style="font-size:10px;font-weight:400">pts</small></b></div>`).join('')}
function renderGame(){let q=session.current,p=getPlayer(),answered=session.answer!==null,round=session.tie?'DESEMPATE '+session.round:'RONDA '+(Math.floor(session.pos/session.players.length)+1)+' DE '+session.count;
mount(`<section class="game"><div class="gamehead"><div><div class="eyebrow">${session.study?'PRÁCTICA TRANQUILA':round}</div><h1>Es tu turno, ${esc(p.name)}.</h1></div><button class="quiet" onclick="home()">Pausar y salir ↗</button></div><div class="scoreboard">${scoreMarkup()}</div><div class="panel gamepanel"><div class="questionmeta"><span class="badge">${esc(q.topic)}</span><span class="clock" id="clock">${session.study?'Sin reloj':formatTime(session.remaining)}</span></div><div class="progress" aria-label="Progreso de la partida"><div style="width:${Math.round(session.pos/session.schedule.length*100)}%"></div></div><h2 class="question" id="question">${esc(q.q)}</h2><div class="options" aria-labelledby="question">${q.o.map((o,i)=>`<button class="option ${session.eliminated.includes(i)?'eliminated':''} ${answered&&i===q.c?'correct':''} ${answered&&session.answer.chosen===i&&i!==q.c?'wrong':''}" onclick="answer(${i})" ${answered||!session.started?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}${answered&&i===q.c?' ✓':''}${answered&&session.answer.chosen===i&&i!==q.c?' ✕':''}</span></button>`).join('')}</div>${answered?answerMarkup():''}<div id="voteSummary"></div><div class="gameactions">${!answered&&!session.study?`<button class="btn" id="timerButton" onclick="toggleTimer()">${session.running?'Ⅱ Pausar':session.started?'▶ Continuar tiempo':'▶ Iniciar tiempo'}</button>`:''}${answered?`<button class="btn full" onclick="advance()">${session.pos===session.schedule.length-1?'Ver resultado de la ronda':'Siguiente persona'} →</button>`:`<span class="fine" style="margin:0">${session.study?'Leé con calma. Sin penalizaciones.':'Cada acierto suma 10 puntos.'}</span>`}</div></div>${!session.study&&!session.tie?`<div class="jokers"><button class="joker" onclick="fifty()" ${p.jokers.fifty||answered?'disabled':''}>½ &nbsp; 50/50<small>Quitá dos opciones</small></button><button class="joker" onclick="audience()" ${p.jokers.audience||answered?'disabled':''}>▥ &nbsp; Público<small>Cargá los votos reales</small></button><button class="joker" onclick="extend()" ${p.jokers.extend||answered?'disabled':''}>＋15 segundos<small>Un poco de aire</small></button></div>`:''}<p class="hint">${answered?'Las referencias permiten revisar la respuesta en su contexto.':session.study?'Podés consultar todas las referencias al terminar.':'El reloj se pausa al salir de esta pantalla. Atajos: teclas 1, 2, 3 y 4.'}</p></section>`);renderVotes()}
function formatTime(n){return String(Math.max(0,Math.ceil(n??0))).padStart(2,'0')+' s'}
function toggleTimer(){if(session.running){pause();renderGame();return}if(session.answer!==null)return;session.started=true;session.running=true;session.deadline=Date.now()+session.remaining*1000;save();renderGame();clearInterval(timer);timer=setInterval(tick,150)}
function tick(){if(!session?.running)return;session.remaining=Math.max(0,(session.deadline-Date.now())/1000);if($('clock')){$('clock').textContent=formatTime(session.remaining);$('clock').classList.toggle('low',session.remaining<=5)}if(session.remaining<=0)answer(-1);else save()}
function pause(){clearInterval(timer);timer=null;if(session?.running){session.remaining=Math.max(0,(session.deadline-Date.now())/1000);session.running=false;save();if($('timerButton'))$('timerButton').textContent='▶ Continuar tiempo'}}
function answer(i){if(!session||session.answer!==null||!session.started||session.eliminated.includes(i))return;if(session.running&&Date.now()>=session.deadline)i=-1;pause();let right=i===session.current.c;if(right)getPlayer().score+=10;session.answer={chosen:i,right};session.log.push({q:session.current,player:session.schedule[session.pos],chosen:i,right,tie:session.tie});save();renderGame()}
function answerMarkup(){let q=session.current,a=session.answer;return `<section class="answerbox" role="status"><h3 style="color:${a.right?'var(--good)':'var(--bad)'}">${a.right?'¡Bien pensado! +10 puntos':a.chosen===-1?'Se terminó el tiempo.':'Esta vez no. Seguimos aprendiendo.'}</h3><p><b>Respuesta: ${esc(q.o[q.c])}.</b> ${esc(q.ex)}</p>${q.ref?`<a href="${esc(q.url)}" target="_blank" rel="noopener noreferrer">Leer ${esc(q.ref)} ↗</a>`:''}</section>`}
function advance(){if(session.answer===null)return;session.pos++;if(session.pos<session.schedule.length)return nextCard();let max=Math.max(...session.players.map(p=>p.score)),leaders=session.players.map((p,i)=>p.score===max?i:-1).filter(i=>i>=0);if(leaders.length===1||session.study)return finish();if(session.deck.length-session.cursor<leaders.length){session.shared=true;return finish()}session.tie=true;session.pendingTie=true;session.round++;session.schedule=leaders;session.pos=0;save();modal('Una ronda más.',`<p>Empate entre <b>${leaders.map(i=>esc(session.players[i].name)).join(' y ')}</b>. Una pregunta nueva para cada persona, 15 segundos y sin comodines.</p><button class="btn full" onclick="closeModal();nextCard()">Comenzar desempate →</button>`)}
function fifty(){let p=getPlayer();if(p.jokers.fifty||session.answer!==null||session.tie)return;session.eliminated=shuffle([0,1,2,3].filter(i=>i!==session.current.c)).slice(0,2);p.jokers.fifty=true;save();renderGame()}
function extend(){let p=getPlayer();if(p.jokers.extend||session.answer!==null||session.tie)return;session.remaining+=15;if(session.running)session.deadline+=15000;p.jokers.extend=true;save();renderGame()}
function audience(){let p=getPlayer();if(p.jokers.audience||session.answer!==null||session.tie)return;modal('Escuchemos al público.',`<p>Pedí que levanten la mano por A, B, C o D y anotá la cantidad de votos. Son votos de las personas presentes, no una simulación.</p>${session.current.o.map((o,i)=>`<label class="vote"><span><b>${'ABCD'[i]}</b> · ${esc(o)}</span><input aria-label="Votos ${'ABCD'[i]}" id="vote${i}" type="number" min="0" max="9999" step="1" value="0"></label>`).join('')}<p id="voteError" class="error"></p><button class="btn full" onclick="submitVotes()">Mostrar votación</button>`)}
function submitVotes(){let v=[0,1,2,3].map(i=>Number($('vote'+i).value));if(v.some(n=>!Number.isInteger(n)||n<0||n>9999)||!v.some(n=>n>0)){$('voteError').textContent='Ingresá al menos un voto. Usá números enteros entre 0 y 9999.';return}session.votes=v;getPlayer().jokers.audience=true;save();closeModal();renderGame()}
function renderVotes(){if(!session?.votes||!$('voteSummary'))return;let total=session.votes.reduce((a,b)=>a+b,0);$('voteSummary').innerHTML=`<div class="answerbox"><div class="eyebrow">PÚBLICO · ${total} VOTOS REALES</div><div class="row" style="margin-top:10px">${session.votes.map((v,i)=>`<span class="badge">${'ABCD'[i]} · ${Math.round(v/total*100)}%</span>`).join('')}</div><p class="fine">${session.answer!==null?'Así votó el público en esta pregunta.':'La mayoría también puede equivocarse. Reanudá el reloj cuando estés listo.'}</p></div>`}
function resumeGame(){if(!session||session.done)return;pause();if(session.pendingTie)return nextCard();if(session.pos>=session.schedule.length)return advance();if(!session.current)return nextCard();renderGame()}
function finish(){pause();session.done=true;let max=Math.max(...session.players.map(p=>p.score));session.winners=session.players.map((p,i)=>p.score===max?i:-1).filter(i=>i>=0);if(!session.historySaved){let h=read(HKEY,[]);h.unshift({date:new Date().toISOString(),names:session.winners.map(i=>session.players[i].name),score:max,mode:session.mode,study:session.study});write(HKEY,h.slice(0,50));session.historySaved=true}save();renderResult()}
function renderResult(){let ranked=session.players.map((p,i)=>({...p,i})).sort((a,b)=>b.score-a.score),wins=session.winners.map(i=>session.players[i].name).join(' y '),right=session.log.filter(l=>l.right).length;mount(`<section class="game"><div class="result-hero"><span class="seal">✳</span><div class="eyebrow">${session.study?'PRÁCTICA COMPLETADA':'FIN DE LA PARTIDA'}</div><h1>${session.study?'Una idea más para llevarte.':esc(wins)+(session.winners.length>1?', primer puesto compartido.':', ¡bien jugado!')}</h1><p>${right} aciertos en ${session.log.length} respuestas. ${session.shared?'Se agotaron las preguntas para un desempate completo.':''}</p></div><div class="panel"><h2 style="font-size:29px">Así quedó la mesa.</h2><div class="ranking">${ranked.map((p,i)=>`<div class="rank"><span class="place">${i&&ranked[i-1].score===p.score?'=':i+1}</span><span class="name">${esc(p.name)}<small>${session.log.filter(l=>l.player===p.i&&l.right).length} aciertos</small></span><b>${p.score}<small>puntos</small></b></div>`).join('')}</div><div class="row"><button class="btn" onclick="home()">Armar otra partida ↗</button><button class="btn secondary" onclick="shareResult()">Compartir resultado</button></div><details style="margin-top:28px"><summary style="cursor:pointer;font-weight:650">Repasar las ${session.log.length} respuestas</summary>${session.log.map(l=>`<article class="reviewrow"><div class="eyebrow">${esc(session.players[l.player].name)} · ${l.right?'ACIERTO':'PARA REPASAR'}</div><h3>${esc(l.q.q)}</h3><p>Elegiste: ${l.chosen<0?'Sin respuesta':esc(l.q.o[l.chosen])}<br><b>Correcta: ${esc(l.q.o[l.q.c])}</b><br>${esc(l.q.ex)}</p>${l.q.ref?`<a target="_blank" rel="noopener noreferrer" href="${esc(l.q.url)}">${esc(l.q.ref)} ↗</a>`:''}</article>`).join('')}</details></div></section>`)}
async function shareResult(){let text='Noche de Trivia\n'+session.players.map(p=>p.name+': '+p.score+' puntos').join('\n');try{if(navigator.share)await navigator.share({title:'Noche de Trivia',text});else if(navigator.clipboard){await navigator.clipboard.writeText(text);notify('Resultado copiado para compartir.')}else modal('Tu resultado',`<p style="white-space:pre-line;user-select:text">${esc(text)}</p><p>Seleccioná y copiá el resultado para compartirlo.</p>`)}catch(e){if(e.name!=='AbortError')notify('No se pudo compartir. Intentá de nuevo.')}}
function showHistory(){modal('Las noches que compartimos.',read(HKEY,[]).map(e=>`<div class="historyrow"><b>${esc(e.names.join(' y '))} · ${e.score} puntos</b><small>${e.study?'Práctica':e.mode==='bible'?'Desafío bíblico':'Cultura general'} · ${new Date(e.date).toLocaleDateString('es-AR')}</small></div>`).join('')||'<p>Todavía no hay partidas terminadas. La próxima puede ser la primera.</p>')}
function showLibrary(){pause();mount(`<div class="pageintro"><div><div class="eyebrow">BIBLIOTECA BÍBLICA · ${BIBLE.length} PREGUNTAS</div><h1>La curiosidad sigue.</h1></div><button class="quiet" onclick="home()">← Volver</button></div><p class="muted" style="margin-bottom:24px;max-width:700px">Preguntas redactadas sobre pasajes concretos de la Traducción del Nuevo Mundo. Abrí cada tarjeta para ver la respuesta y su referencia. No se incluyen las preguntas pendientes de verificar del archivo original.</p><div class="libraryfilters"><input id="librarySearch" type="search" placeholder="Buscá una persona, un relato o un pasaje…" aria-label="Buscar preguntas" value="${esc(librarySearch)}" oninput="librarySearch=this.value;renderLibrary()"><select aria-label="Filtrar por tema" onchange="libraryTopic=this.value;renderLibrary()"><option>Todos</option>${topics().map(t=>`<option ${libraryTopic===t?'selected':''}>${t}</option>`).join('')}</select></div><p class="fine" id="libraryCount" style="margin-bottom:18px"></p><div class="librarylist" id="libraryList"></div>`);renderLibrary()}
function normalized(s){return s.toLocaleLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function renderLibrary(){let list=BIBLE.filter(q=>(libraryTopic==='Todos'||q.topic===libraryTopic)&&normalized(q.q+' '+q.ref+' '+q.o.join(' ')).includes(normalized(librarySearch)));$('libraryCount').textContent=list.length+' preguntas encontradas';$('libraryList').innerHTML=list.map(q=>`<details><summary><span class="eyebrow">${esc(q.topic)} · ${q.level}</span>${esc(q.q)}</summary><p><b>${esc(q.o[q.c])}.</b> ${esc(q.ex)}</p><a href="${esc(q.url)}" target="_blank" rel="noopener noreferrer">Leer ${esc(q.ref)} ↗</a></details>`).join('')||'<p class="empty">No hay coincidencias. Probá con otra palabra.</p>'}
function support(){modal('Gracias por sumar.',`<p>El archivo original incluye este alias de colaboración voluntaria. No es necesario aportar para jugar.</p><label class="field">Alias de transferencia<input readonly value="cetro.chispa.tribu" aria-label="Alias de colaboración"></label><p class="fine">Comprobá el destinatario en tu banco antes de confirmar una transferencia.</p>`)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});window.addEventListener('pagehide',pause);document.addEventListener('keydown',e=>{if($('modal').open||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if($('question')&&['1','2','3','4'].includes(e.key)){e.preventDefault();answer(Number(e.key)-1)}});$('modal').addEventListener('click',e=>{if(e.target===$('modal')){let r=$('modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
if(session)session.running=false;
home();
</script></body></html>
